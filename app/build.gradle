plugins {
    id "com.android.application"
}

android {
    namespace "com.autousbcopier"
    compileSdk 35

    defaultConfig {
        applicationId "com.autousbcopier"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
